<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overlays of Population by U.S. State</title>
  <meta name="Description" content="Display, transform, and interact with GeoJSON-based map overlays.">

  <style>
.container {
    font-family: "Helvetica Neue", sans-serif;
    position: relative;
}

#map {
    width: 100vw;
    height: 100vh;
}

#infoPopup {
    display: none;
    top: 7px;
    left: 67px;
    background: #FFFFFF;
    padding: 5px 15px;
    position: absolute;
    z-index: 1000;
    min-width:180px;
    font: 13px/16px "-apple-system-font" ,"HelveticaNeue-Medium", "Helvetica", "Arial", "sans-serif";
    color: #212121;
    border: 1px solid rgba(0,0,0,0.2);
    border-radius: 3px;
}

.container .map-legend {
    position: absolute;
    z-index: 1000;
    top: 7px;
    left: 7px;
}

.map-legend div {
    margin-bottom: 5px;
    width: 40px;
    font-size: 12px;
    color: #fff;
    padding: 4px 7px;
}

#infoPopup .info {
    padding: 10px 0;
    box-sizing: border-box;
}

#infoPopup .info:first-child {
    border-bottom: 1px solid rgba(0,0,0,0.2);
}

#infoPopup .info-country,  #infoPopup .info-population{
    margin-left: 5px;
    color: #464545;
    font-style: italic;
}
  </style>
  <script type="module" crossorigin src="/maps/assets/overlayofpopulationbyustates-Q7u6twsz.js"></script>
  <link rel="modulepreload" crossorigin href="/maps/assets/token-D5_eC6oK.js">
  <link rel="stylesheet" crossorigin href="/maps/assets/token-DRXadvmM.css">
</head>

<body>

  <div class="container">
    <div id="map"></div>
    <div id="infoPopup">
      <div class="info">
        <span>State:</span>
        <span class="info-country"></span>
      </div>
      <div class="info">
        <span>Population:</span>
        <span class="info-population"></span>
      </div>
    </div>
    <div class="map-legend"></div>
  </div>
</body>

</html>
