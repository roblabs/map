<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgo=" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Region and Zoom Limits</title>
  <meta name="Description" content="Limit a map viewport's zoom level, and constraints of its latitude and longitude.">

  <style>
    #container {
        width: 100%;
        height: 600px;
        font-family: "Helvetica Neue", sans-serif;
    }

    #map-container {
        width: 100vw;
        height: 100vh;
    }

    #city-regions {
        width: 100%;
        height: 40px;
    }

    #city-regions > label {
        float: left;
        width: 50%;
        height: 40px;

        line-height: 40px;
        text-align: center;
        cursor: pointer;
    }

    #city-regions > input {
        display: none;
    }

    #city-regions > input + label {
        background-color: #fff;
    }

    #city-regions > input:checked + label {
        background-color: #08f;
        color: #f8f9f0;
    }

  </style>
  <script type="module" crossorigin src="/maps/assets/regionandzoomlimits-UmKpM3l6.js"></script>
  <link rel="modulepreload" crossorigin href="/maps/assets/token-D5_eC6oK.js">
  <link rel="stylesheet" crossorigin href="/maps/assets/token-DRXadvmM.css">
</head>

<body>
  <div id="container"></div>

    <div id="container">
      <div id="city-regions">
        <input id="city-sanfrancisco" type="radio" value="sanfrancisco" name="city" checked="checked" />
        <label for="city-sanfrancisco">San Francisco</label>
    
        <input id="city-toronto" type="radio" value="toronto" name="city" />
        <label for="city-toronto">Toronto</label>
      </div>
      <div id="map-container"></div>
    </div>
</body>

</html>
